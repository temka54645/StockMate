[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "warehouse-app"

[[cronJobs]]
name = "daily-scan"
schedule = "0 8 * * *"
command = "curl -s -H 'Authorization: Bearer $CRON_SECRET' http://localhost:3000/api/cron/scan"

[[cronJobs]]
name = "retry-dispatch"
schedule = "*/30 * * * *"
command = "curl -s -H 'Authorization: Bearer $CRON_SECRET' http://localhost:3000/api/cron/dispatch"
